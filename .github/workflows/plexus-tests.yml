name: plexus tests

on:
  push:
    paths:
      - 'plexus/**'
      - 'experiments/**'
      - '.github/workflows/plexus-tests.yml'
  pull_request:
    paths:
      - 'plexus/**'
      - 'experiments/**'
      - '.github/workflows/plexus-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy pytest

      - name: Run test suite
        run: python -m pytest plexus/tests/ -v

      - name: Check the tests would notice if a mechanism broke
        # A green suite proves nothing by itself. This breaks each mechanism on
        # purpose and fails if the test that names it stays green. Three tests
        # in this repo survived their own mutation when it was first run --
        # including the one guarding the bug where the dendritic plateau was
        # silently disconnected -- and a fourth mechanism, Dale's law, turned
        # out to have no test that its sign was applied at all.
        run: python experiments/mutation.py

      - name: Check the benchmarks still defeat trivial models
        # A benchmark is only worth reporting if simple things fail on it. If a
        # change ever makes delayed XOR solvable by a rate code or by a linear
        # model over time bins, every result on it becomes meaningless -- so
        # this is a guard on the *experiments*, not just on the code.
        run: python experiments/baselines.py --task xor --n 800
